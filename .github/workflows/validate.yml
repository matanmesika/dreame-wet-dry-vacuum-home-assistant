name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/ruff-action@v3

  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: pip install pytest aiohttp pycryptodome "paho-mqtt>=2.0"
      - name: Run tests
        run: pytest -q

  package:
    name: H15 test bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Upload integration folder
        uses: actions/upload-artifact@v4
        with:
          name: dreame-wet-dry-vacuum-h15-test
          path: custom_components/dreame_wet_dry_vacuum
          if-no-files-found: error
          retention-days: 7
