name: Generate Dreame integration brand images

on:
  push:
    branches:
      - release/dreame-card-standalone-prep
    paths:
      - assets/branding/dreame-logo.svg
      - scripts/generate_dreame_brand.py
      - .github/workflows/generate-dreame-brand.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.repository == 'matanmesika/dreame-wet-dry-vacuum-home-assistant'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install rasterizer
        run: python -m pip install --disable-pip-version-check "Pillow>=10,<13" "CairoSVG>=2.7,<3"
      - name: Generate integration icon and logo
        run: python scripts/generate_dreame_brand.py
      - name: Commit PNG images on candidate branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/dreame_wet_dry_vacuum/brand/icon.png \
            custom_components/dreame_wet_dry_vacuum/brand/icon@2x.png \
            custom_components/dreame_wet_dry_vacuum/brand/logo.png \
            custom_components/dreame_wet_dry_vacuum/brand/logo@2x.png
          if ! git diff --cached --quiet; then
            git commit -m "Add genuine Dreame integration logo and icon PNG assets"
            git push origin HEAD:release/dreame-card-standalone-prep
          fi
